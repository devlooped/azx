# PR / main: linux-x64 Payload + pack pointer + azx.linux-x64. Full RID matrix is publish.yml.

name: build
on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        description: Configuration
        options:
        - Release
        - Debug
  push:
    branches: [ main, 'feature/*', 'rel/*' ]
    paths-ignore:
      - changelog.md
      - readme.md
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true
  PackOnBuild: true
  GeneratePackageOnBuild: false
  VersionPrefix: 42.42.${{ github.run_number }}
  VersionLabel: ${{ github.ref }}
  GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  Configuration: ${{ github.event.inputs.configuration || 'Release' }}
  SLEET_FEED_URL: ${{ vars.SLEET_FEED_URL }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ⚙ pip
        run: sudo apt-get update && sudo apt-get install -y python3-pip

      - name: 📦 Azure.Cli
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/Azure.Cli/Azure.Cli.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack.binlog
          if ($LASTEXITCODE -ne 0) { throw "Azure.Cli pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/Azure.Cli/Azure.Cli.csproj -c $env:Configuration -r linux-x64 -p:GeneratePackageOnBuild=false -bl:pack-linux-x64.binlog
          if ($LASTEXITCODE -ne 0) { throw "Azure.Cli linux-x64 pack failed with exit code $LASTEXITCODE." }

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        run: dnx --yes retest -- --no-build

      - name: 📦 azx
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/azx/azx.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack-azx.binlog
          if ($LASTEXITCODE -ne 0) { throw "azx pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/azx/azx.csproj -c $env:Configuration -r linux-x64 -p:GeneratePackageOnBuild=false -bl:pack-azx-linux-x64.binlog
          if ($LASTEXITCODE -ne 0) { throw "azx linux-x64 pack failed with exit code $LASTEXITCODE." }

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: bin/*.nupkg
          retention-days: 7
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs
          path: '*.binlog'

      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: env.SLEET_CONNECTION != ''
        shell: bash
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r)
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ✓ ensure format
        run: |
          dotnet format whitespace --verify-no-changes --no-restore -v:diag --exclude ~/.nuget
          dotnet format style --verify-no-changes --no-restore -v:diag --exclude ~/.nuget
